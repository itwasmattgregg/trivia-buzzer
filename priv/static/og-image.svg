<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient matching app theme -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Buzzer button gradient -->
    <linearGradient id="buzzerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff3742;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glass effect -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Glass card background -->
  <rect x="100" y="100" width="1000" height="430" rx="20" fill="url(#glassGradient)" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  
  <!-- Main buzzer button -->
  <circle cx="300" cy="315" r="80" fill="url(#buzzerGradient)" stroke="#fff" stroke-width="4"/>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">BUZZ!</text>
  
  <!-- App title -->
  <text x="500" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">Trivia Buzzer</text>
  
  <!-- Subtitle -->
  <text x="500" y="250" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.9">Real-time trivia games with team management</text>
  
  <!-- Features list -->
  <text x="500" y="320" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.8">⚡ Lightning fast buzzers</text>
  <text x="500" y="350" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.8">👥 Team management</text>
  <text x="500" y="380" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.8">📱 Mobile friendly</text>
  <text x="500" y="410" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.8">🚀 No downloads required</text>
  
  <!-- Decorative elements -->
  <circle cx="950" cy="150" r="40" fill="#ffffff" opacity="0.1"/>
  <circle cx="1000" cy="200" r="30" fill="#ffffff" opacity="0.08"/>
  <circle cx="1050" cy="120" r="25" fill="#ffffff" opacity="0.06"/>
  
  <!-- Small buzzer buttons -->
  <circle cx="950" cy="450" r="25" fill="url(#buzzerGradient)" opacity="0.7"/>
  <text x="950" y="455" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="white">BUZZ</text>
  
  <circle cx="1000" cy="480" r="20" fill="url(#buzzerGradient)" opacity="0.5"/>
  <text x="1000" y="485" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="white">BUZZ</text>
  
  <!-- URL -->
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.7">trivia-buzzer.com</text>
</svg>
