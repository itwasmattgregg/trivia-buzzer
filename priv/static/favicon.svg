<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="buzzerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff3742;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Buzzer Button -->
  <circle cx="16" cy="16" r="14" fill="url(#buzzerGradient)" stroke="#fff" stroke-width="2"/>
  
  <!-- Buzzer Text -->
  <text x="16" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">BUZZ</text>
  
  <!-- Highlight -->
  <circle cx="12" cy="12" r="3" fill="#fff" opacity="0.3"/>
</svg>
